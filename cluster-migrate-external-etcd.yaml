apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: quick-start
  namespace: default
spec:
  controlPlane:
    healthCheck:
      checks:
        unhealthyNodeConditions:
        - status: Unknown
          timeoutSeconds: 300
          type: Ready
        - status: "False"
          timeoutSeconds: 300
          type: Ready
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachineTemplate
        name: quick-start-control-plane
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: quick-start-control-plane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DockerClusterTemplate
      name: quick-start-cluster
  patches:
  - definitions:
    - jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/imageRepository
        valueFrom:
          variable: imageRepository
      selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
    description: Sets the imageRepository used for the KubeadmControlPlane.
    enabledIf: '{{ ne .imageRepository "" }}'
    name: imageRepository
  - definitions:
    - jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/etcd
        valueFrom:
          template: |
            local:
              imageTag: {{ .etcdImageTag }}
      selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
    description: Sets tag to use for the etcd image in the KubeadmControlPlane.
    enabledIf: '{{ ne .etcdImageTag "" }}'
    name: etcdImageTag
  - definitions:
    - jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/dns
        valueFrom:
          template: |
            imageTag: {{ .coreDNSImageTag }}
      selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
    description: Sets tag to use for the etcd image in the KubeadmControlPlane.
    enabledIf: '{{ ne .coreDNSImageTag "" }}'
    name: coreDNSImageTag
  - definitions:
    - jsonPatches:
      - op: add
        path: /spec/template/spec/customImage
        valueFrom:
          template: |
            kindest/node:{{ .builtin.machineDeployment.version | replace "+" "_" }}
      selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
    - jsonPatches:
      - op: add
        path: /spec/template/spec/template/customImage
        valueFrom:
          template: |
            kindest/node:{{ .builtin.machinePool.version | replace "+" "_" }}
      selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachinePoolTemplate
        matchResources:
          machinePoolClass:
            names:
            - default-worker
    - jsonPatches:
      - op: add
        path: /spec/template/spec/customImage
        valueFrom:
          template: |
            kindest/node:{{ .builtin.controlPlane.version | replace "+" "_" }}
      selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachineTemplate
        matchResources:
          controlPlane: true
    description: Sets the container image that is used for running dockerMachines
      for the controlPlane and default-worker machineDeployments.
    name: customImage
  - definitions:
    - jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs
        value:
        - name: admission-control-config-file
          value: /etc/kubernetes/kube-apiserver-admission-pss.yaml
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraVolumes
        value:
        - hostPath: /etc/kubernetes/kube-apiserver-admission-pss.yaml
          mountPath: /etc/kubernetes/kube-apiserver-admission-pss.yaml
          name: admission-pss
          pathType: File
          readOnly: true
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/files
        valueFrom:
          template: |
            - content: |
                apiVersion: apiserver.config.k8s.io/v1
                kind: AdmissionConfiguration
                plugins:
                - name: PodSecurity
                  configuration:
                    apiVersion: pod-security.admission.config.k8s.io/v1{{ if semverCompare "< v1.25-0" .builtin.controlPlane.version }}beta1{{ end }}
                    kind: PodSecurityConfiguration
                    defaults:
                      enforce: "{{ .podSecurityStandard.enforce }}"
                      enforce-version: "latest"
                      audit: "{{ .podSecurityStandard.audit }}"
                      audit-version: "latest"
                      warn: "{{ .podSecurityStandard.warn }}"
                      warn-version: "latest"
                    exemptions:
                      usernames: []
                      runtimeClasses: []
                      namespaces: [kube-system]
              path: /etc/kubernetes/kube-apiserver-admission-pss.yaml
      selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
    description: Adds an admission configuration for PodSecurity to the kube-apiserver.
    enabledIf: '{{ .podSecurityStandard.enabled }}'
    name: podSecurityStandard
  - definitions:
    - jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/files/-
        valueFrom:
          template: |
            path: /etc/kubernetes/install_etcd.sh
            owner: "root:root"
            permissions: "0744"
            content: |
              #!/bin/bash
              set -euo pipefail
              readonly ETCD_VER="v3.5.16"
              readonly ETCD_URL="https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz"
              log() { echo -e "\033[0;32m✅ $1\033[0m"; }
              err() { echo -e "\033[0;31m❌ $1\033[0m" >&2; exit "${2:-1}"; }
              step() { echo -e "\n\033[1;33m==> $1\033[0m"; }
              if command -v etcdctl &>/dev/null && [[ $(etcdctl version | head -n1 | awk '{print $3}') == "$ETCD_VER" ]]; then
                  log "etcdctl ${ETCD_VER} déjà installé"
                  exit 0
              fi
              step "Installation etcdctl ${ETCD_VER}"
              curl -fsSL "$ETCD_URL" -o /tmp/etcd.tar.gz || err "Téléchargement échoué"
              tar xzf /tmp/etcd.tar.gz -C /usr/local/bin --strip-components=1 "etcd-${ETCD_VER}-linux-amd64/etcdctl" "etcd-${ETCD_VER}-linux-amd64/etcd"
              rm -f /tmp/etcd.tar.gz
              log "etcd installé"
      selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
    description: Installs etcd binaries on the control plane nodes.
    enabledIf: '{{ .podSecurityStandard.enabled }}'
    name: installEtcd
  - definitions:
    - jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/files/-
        valueFrom:
          template: |
            path: /etc/kubernetes/etcd_migration.sh
            owner: "root:root"
            permissions: "0744"
            content: |
              #!/bin/bash
              set -euo pipefail
              readonly KUBEADM_FILE="/run/kubeadm/kubeadm.yaml"
              log() { echo -e "\033[0;32m✅ $1\033[0m"; }
              err() { echo -e "\033[0;31m❌ $1\033[0m" >&2; exit "${2:-1}"; }
              step() { echo -e "\n\033[1;33m==> $1\033[0m"; }
              validate_ip() {
                  [[ $1 =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || err "IP invalide: $1"
                  local IFS='.'; read -ra O <<< "$1"
                  for o in "${O[@]}"; do ((o <= 255)) || err "Octet IP > 255"; done
              }
              get_array_length() {
                  local -n arr=$1
                  echo "${arr[@]}" | wc -w
              }
              parse_endpoints() {
                  declare -g -A ETCD_ENDPOINTS
                  declare -g -a ETCD_IPS
                  declare -g -a ETCD_NAMES
                  declare -g ETCD_ENDPOINTS_STR=""
                  local name=""
                  local ip=""
                  for arg in "$@"; do
                      if [[ $arg =~ ^([^:]+):([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                          name="${BASH_REMATCH[1]}"
                          ip="${BASH_REMATCH[2]}"
                          validate_ip "$ip"
                          ETCD_ENDPOINTS["$name"]="$ip"
                          ETCD_IPS+=("$ip")
                          ETCD_NAMES+=("$name")
                          [[ -n "$ETCD_ENDPOINTS_STR" ]] && ETCD_ENDPOINTS_STR+=","
                          ETCD_ENDPOINTS_STR+="https://${ip}:2379"
                          name=""
                          ip=""
                      elif [[ $arg =~ ^([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                          local count=$(get_array_length ETCD_IPS)
                          name="etcd-node-$((count + 1))"
                          ip="$arg"
                          validate_ip "$ip"
                          ETCD_ENDPOINTS["$name"]="$ip"
                          ETCD_IPS+=("$ip")
                          ETCD_NAMES+=("$name")
                          [[ -n "$ETCD_ENDPOINTS_STR" ]] && ETCD_ENDPOINTS_STR+=","
                          ETCD_ENDPOINTS_STR+="https://${ip}:2379"
                          name=""
                          ip=""
                      elif [[ $arg =~ ^name:(.+)$ ]]; then
                          name="${BASH_REMATCH[1]}"
                      elif [[ $arg =~ ^ip:([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                          ip="${BASH_REMATCH[1]}"
                          if [[ -n "$name" ]]; then
                              validate_ip "$ip"
                              ETCD_ENDPOINTS["$name"]="$ip"
                              ETCD_IPS+=("$ip")
                              ETCD_NAMES+=("$name")
                              [[ -n "$ETCD_ENDPOINTS_STR" ]] && ETCD_ENDPOINTS_STR+=","
                              ETCD_ENDPOINTS_STR+="https://${ip}:2379"
                              name=""
                              ip=""
                          else
                              err "Format endpoint invalide: $arg (ip sans name)"
                          fi
                      else
                          err "Format endpoint invalide: $arg"
                      fi
                  done
                  local count=$(get_array_length ETCD_IPS)
                  log "Endpoints parsés: $count nœuds (${ETCD_NAMES[*]})"
              }
              setup_env() {
                  export ETCDCTL_API=3 ETCDCTL_CACERT=/etc/kubernetes/pki/etcd/ca.crt \
                          ETCDCTL_CERT=/tmp/etcd-client.crt ETCDCTL_KEY=/tmp/etcd-client.key
              }
              gen_certs() {
                  step "Génération certificats"
                  ETCDCTL_CACERT_KEY=/etc/kubernetes/pki/etcd/ca.key
                  openssl genrsa -out $ETCDCTL_KEY 2048 2>/dev/null
                  openssl req -new -key $ETCDCTL_KEY -out /tmp/etcd-client.csr -subj "/CN=etcd-client" 2>/dev/null
                  openssl x509 -req -in /tmp/etcd-client.csr -CA $ETCDCTL_CACERT -CAkey $ETCDCTL_CACERT_KEY \
                      -CAcreateserial -out $ETCDCTL_CERT -days 1 -sha256 2>/dev/null
                  log "Certificats OK"
              }
              prekubeadm() {
                  [[ -f "$KUBEADM_FILE" ]] || { echo "Pas de $KUBEADM_FILE (normal si pas 1er CP)"; return 0; }
                  local count=$(get_array_length ETCD_IPS)
                  step "Pré-kubeadm avec $count endpoints existants"
                  gen_certs
                  /etc/kubernetes/install_etcd.sh
                  local ip=$(hostname -I | awk '{print $1}')
                  local hn=$(hostname)
                  local initial_cluster=""
                  for name in "${ETCD_NAMES[@]}"; do
                      member_ip="${ETCD_ENDPOINTS[$name]}"
                      [[ -n "$initial_cluster" ]] && initial_cluster+=","
                      initial_cluster+="${name}=https://${member_ip}:2380"
                  done
                  [[ -n "$initial_cluster" ]] && initial_cluster+=","
                  initial_cluster+="${hn}=https://${ip}:2380"
                  step "Ajout membre etcd: ${hn}"
                  etcdctl --endpoints="$ETCD_ENDPOINTS_STR" member add "$hn" --peer-urls="https://${ip}:2380" || err "Ajout membre échoué"
                  sed -i "/initial-cluster-state:/a\      initial-cluster: ${initial_cluster}" "$KUBEADM_FILE"
                  log "Config pré-kubeadm OK. Démarrez kubeadm maintenant"
                  log "Initial cluster: ${initial_cluster}"
              }
              postkubeadm() {
                  [[ -f "$KUBEADM_FILE" ]] || { echo "Pas de $KUBEADM_FILE (normal si pas 1er CP)"; return 0; }
                  local count=$(get_array_length ETCD_IPS)
                  step "Post-kubeadm avec $count anciens endpoints"
                  local ip=$(hostname -I | awk '{print $1}')
                  local le="https://${ip}:2379"
                  local ep="${ETCD_ENDPOINTS_STR},${le}"
                  sleep 5
                  export KUBECONFIG=/etc/kubernetes/super-admin.conf
                  step "Nettoyage ConfigMap"
                  kubectl get cm -n kube-system kubeadm-config -o yaml > /tmp/kubeadm-config.yaml
                  sed -i '/^[[:space:]]*initial-cluster:/d' /tmp/kubeadm-config.yaml
                  kubectl apply -f /tmp/kubeadm-config.yaml
                  step "Vérification synchronisation avec anciens nœuds"
                  local max_attempts=30
                  local attempt=0
                  local first_old_ip="${ETCD_IPS[0]}"
                  
                  while ((attempt < max_attempts)); do
                      local old_rev_output
                      old_rev_output=$(etcdctl --endpoints="https://${first_old_ip}:2379" endpoint status --write-out=json 2>/dev/null) || old_rev_output=""
                      local old_rev=""
                      if [[ -n "$old_rev_output" ]]; then
                          old_rev=$(echo "$old_rev_output" | jq -r '.[0].Status.header.revision // empty' 2>/dev/null) || old_rev=""
                      fi
                      local new_rev_output
                      new_rev_output=$(etcdctl --endpoints="$le" endpoint status --write-out=json 2>/dev/null) || new_rev_output=""
                      local new_rev=""
                      if [[ -n "$new_rev_output" ]]; then
                          new_rev=$(echo "$new_rev_output" | jq -r '.[0].Status.header.revision // empty' 2>/dev/null) || new_rev=""
                      fi    
                      echo "Tentative $((attempt + 1))/$max_attempts - Révision ancien: ${old_rev:-N/A} | Révision nouveau: ${new_rev:-N/A}"
                      if [[ -n "$old_rev" && "$old_rev" =~ ^[0-9]+$ && -n "$new_rev" && "$new_rev" =~ ^[0-9]+$ ]]; then
                          if [[ "$new_rev" -ge "$old_rev" ]]; then
                              log "Nœuds synchronisés (nouvelle révision $new_rev >= ancienne révision $old_rev)"
                              break
                          fi
                      else
                          echo "⚠️  Révision non disponible ou invalide, nouvelle tentative..."
                      fi
                      ((attempt++)) || true
                      if [[ $attempt -eq $max_attempts ]]; then
                          err "Timeout: nœuds non synchronisés après $((max_attempts * 10)) secondes"
                      fi
                      sleep 10
                  done
                  # Récupération de l'ID du leader et du nouveau nœud
                  local lid=$(etcdctl --endpoints="$ep" endpoint status --write-out=simple | awk -F, '$5==" true"{print $2}' | tr -d ' ')
                  local oid=$(etcdctl --endpoints="$le" endpoint status --write-out=simple | awk -F, '{print $2}' | tr -d ' ')
                  echo "Local ID: $oid | Leader ID: $lid"
                  if [[ "$lid" != "$oid" ]]; then
                      step "Transfert leadership vers nouveau nœud"
                      etcdctl --endpoints="$ep" move-leader "$oid" || err "Transfert échoué"
                      sleep 2
                      etcdctl --endpoints="$ep" endpoint status --write-out=table
                  else
                      log "Le nouveau nœud est déjà leader"
                  fi
                  step "Suppression des noeuds Kubernetes avec 'master-' dans le nom"
                  local master_nodes=$(kubectl get nodes --no-headers -o custom-columns=":metadata.name" | grep "master-" || true)
                  if [[ -n "$master_nodes" ]]; then
                      while IFS= read -r node_name; do
                          if [[ -n "$node_name" ]]; then
                              step "Drain et suppression du noeud Kubernetes: ${node_name}"
                              kubectl drain "$node_name" --ignore-daemonsets --delete-emptydir-data --force --timeout=300s || echo "⚠️  Échec drain noeud ${node_name}"
                              kubectl delete node "$node_name" || echo "⚠️  Échec suppression noeud ${node_name}"
                              log "Noeud ${node_name} drainé et supprimé"
                          fi
                      done <<< "$master_nodes"
                  else
                      log "Aucun noeud avec 'master-' trouvé"
                  fi
                  log "Attente stabilisation cluster (10s)..."
                  sleep 10
                  step "Suppression des anciens membres etcd"
                  local members_output=$(etcdctl --endpoints="$le" member list --write-out=simple)
                  for old_ip in "${ETCD_IPS[@]}"; do
                      local member_id=$(echo "$members_output" | grep "$old_ip" | awk -F, '{print $1}' | tr -d ' ')
                      if [[ -n "$member_id" ]]; then
                          step "Suppression membre avec IP ${old_ip} (ID: ${member_id})"
                          etcdctl --endpoints="$le" member remove "$member_id" || err "Suppression membre ${member_id} échouée"
                          log "Membre ${member_id} supprimé"
                          sleep 5
                      else
                          echo "⚠️  Aucun membre trouvé avec IP ${old_ip}"
                      fi
                  done
                  step "État final du cluster"
                  etcdctl --endpoints="$le" endpoint status --write-out=table
                  etcdctl --endpoints="$le" member list --write-out=table
                  log "Migration terminée - tous les anciens membres ont été supprimés"
              }
              main() {
                  [[ $EUID -eq 0 ]] || err "Exécuter en root"
                  [[ $# -ge 1 ]] || err "Usage: $0 [prekubeadm|postkubeadm] <endpoint1> [endpoint2] [...]\n Format: name:ip ou simplement ip\n Exemple: $0 prekubeadm etcd-01:10.163.3.58 etcd-02:10.163.3.113"
                  local action="$1"
                  shift
                  case "$action" in
                      prekubeadm|postkubeadm)
                          [[ $# -ge 1 ]] || err "Les actions nécessitent au moins un endpoint"
                          parse_endpoints "$@"
                          setup_env
                          case "$action" in
                              prekubeadm) prekubeadm ;;
                              postkubeadm) postkubeadm ;;
                          esac
                          ;;
                      *)
                          err "Option Error. Use 'prekubeadm' ou 'postkubeadm'" 4
                          ;;
                  esac
                  log "End of Script"
              }
              main "$@"
      selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
    description: Deploys the etcd migration script on the control plane nodes.
    enabledIf: '{{ .podSecurityStandard.enabled }}'
    name: etcdMigration
  variables:
  - name: imageRepository
    required: true
    schema:
      openAPIV3Schema:
        default: ""
        description: imageRepository sets the container registry to pull images from.
          If empty, nothing will be set and the from of kubeadm will be used.
        example: registry.k8s.io
        type: string
  - name: etcdImageTag
    required: true
    schema:
      openAPIV3Schema:
        default: ""
        description: etcdImageTag sets the tag for the etcd image.
        example: 3.5.3-0
        type: string
  - name: coreDNSImageTag
    required: true
    schema:
      openAPIV3Schema:
        default: ""
        description: coreDNSImageTag sets the tag for the coreDNS image.
        example: v1.8.5
        type: string
  - name: podSecurityStandard
    required: false
    schema:
      openAPIV3Schema:
        properties:
          audit:
            default: restricted
            description: audit sets the level for the audit PodSecurityConfiguration
              mode. One of privileged, baseline, restricted.
            type: string
          enabled:
            default: true
            description: enabled enables the patches to enable Pod Security Standard
              via AdmissionConfiguration.
            type: boolean
          enforce:
            default: baseline
            description: enforce sets the level for the enforce PodSecurityConfiguration
              mode. One of privileged, baseline, restricted.
            type: string
          warn:
            default: restricted
            description: warn sets the level for the warn PodSecurityConfiguration
              mode. One of privileged, baseline, restricted.
            type: string
        type: object
  workers:
    machineDeployments:
    - bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: quick-start-default-worker-bootstraptemplate
      class: default-worker
      healthCheck:
        checks:
          unhealthyNodeConditions:
          - status: Unknown
            timeoutSeconds: 300
            type: Ready
          - status: "False"
            timeoutSeconds: 300
            type: Ready
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DockerMachineTemplate
          name: quick-start-default-worker-machinetemplate
    machinePools:
    - bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: quick-start-default-worker-bootstraptemplate
      class: default-worker
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DockerMachinePoolTemplate
          name: quick-start-default-worker-machinepooltemplate
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerClusterTemplate
metadata:
  name: quick-start-cluster
  namespace: default
spec:
  template:
    spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: quick-start-control-plane
  namespace: default
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          featureGates:
            EtcdLearnerMode: true
          apiServer:
            certSANs:
            - localhost
            - 127.0.0.1
            - 0.0.0.0
            - host.docker.internal
          etcd:
            local:
              extraArgs:
                - name: initial-cluster-state
                  value: existing
        preKubeadmCommands:
          - ./etc/kubernetes/etcd_migration.sh prekubeadm etcd1:172.18.0.3 etcd2:172.18.0.4 etcd3:172.18.0.5 >> /tmp/initlogs 2>&1
        postKubeadmCommands:
          - ./etc/kubernetes/etcd_migration.sh postkubeadm etcd1:172.18.0.3 etcd2:172.18.0.4 etcd3:172.18.0.5 >> /tmp/initlogs 2>&1
          - kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/tigera-operator.yaml
          - sleep 5
          - kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/custom-resources.yaml
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: quick-start-control-plane
  namespace: default
spec:
  template:
    spec:
      extraMounts:
      - containerPath: /var/run/docker.sock
        hostPath: /var/run/docker.sock
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: quick-start-default-worker-machinetemplate
  namespace: default
spec:
  template:
    spec:
      extraMounts:
      - containerPath: /var/run/docker.sock
        hostPath: /var/run/docker.sock
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachinePoolTemplate
metadata:
  name: quick-start-default-worker-machinepooltemplate
  namespace: default
spec:
  template:
    spec:
      template: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: quick-start-default-worker-bootstraptemplate
  namespace: default
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
          - name: eviction-hard
            value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
